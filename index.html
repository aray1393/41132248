<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>NFC Nail 4→1 Test</title>
  <style>
    :root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111; color: #f5f5f5; display: grid; place-items: center; padding: 22px; }
    main { width: min(680px, 100%); }
    .card { border: 1px solid #333; border-radius: 18px; padding: 22px; background: #191919; box-shadow: 0 16px 50px rgba(0,0,0,.25); }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { line-height: 1.65; color: #cfcfcf; }
    .status { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin: 18px 0; }
    .slot { text-align: center; border: 1px solid #3a3a3a; border-radius: 12px; padding: 12px 6px; background: #141414; }
    .slot.got { border-color: #777; background: #252525; }
    button, a.btn {
      appearance: none; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 16px;
      background: #eee; color: #111; text-decoration: none; display: inline-block; cursor: pointer; font-weight: 650;
    }
    .secondary { background: #2d2d2d !important; color: #eee !important; border: 1px solid #444 !important; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .unlock { margin-top: 18px; padding: 16px; border: 1px solid #777; border-radius: 14px; background: #222; }
    .small { font-size: 13px; color: #aaa; }
    code, textarea { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
    .setup-item { margin-top: 18px; }
    textarea { width: 100%; min-height: 90px; resize: vertical; border: 1px solid #333; border-radius: 10px; padding: 10px; background: #0d0d0d; color: #eee; }
    .warn { padding: 12px 14px; border-radius: 12px; background: #26221a; border: 1px solid #51472f; color: #e7dcc0; }
  </style>
</head>
<body>
<main>
  <section class="card" id="app"></section>
</main>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "nfc-nail-4to1-v1";

  const PUBLIC = {"A": "https://youtu.be/wp43OdtAAkM", "B": "https://youtu.be/beSO_-Xn3vs", "C": "https://youtu.be/xEeFrLSkMm8", "D": "https://youtu.be/eKoD2CRr_KA"};

  const SHARES = {"A": "MzkV_k0RqU7uD0yO4tjPfliDp6Gb_qMYhZM5i-lyZYWySQ8hnSvtjqxp5jk1IJD0jLpXEQJvrSrQJinvz62-x6gYP690kVoK0MmAryszqGSyqQ", "B": "pZCEvBO7n70heui06uD1EtTqBC1-RzlYKFYc0N_rCcRXbv88d3Jnrou2LTv-Ohga4qePCCeuU8b81QppJOIQBFPgPCJB0tndidEvqQC1JgbBfA", "C": "v3bSv4n3u82gSQlDe76U7dkc9TP9ZBIVlRi5ZGxgHG3wev5Ub-g-MpeaRNq57IjAI4KjpQrs_-iySLWgsrvqNR8ZOaCiUxr82Gv0Q9Ji6LwzEQ", "D": "Qas3jaRnohECEtQWBvLb4zBbNdB18v80TL70ACzEPR9gNTkqzcveS9Nj47EBgj18CdJIyUcaYkzk0c9Ff4cwl5aVZV_2dPBEvEJ9NYnZCZ8jhg"};

  const app = document.getElementById("app");

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);

  function b64urlToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    const bin = atob(s);
    return Uint8Array.from(bin, ch => ch.charCodeAt(0));
  }

  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function decodeTag() {
    const raw = decodeURIComponent(location.hash.slice(1));
    if (!raw) return null;
    const parts = raw.split("~");
    if (parts.length !== 3) return null;
    const [id, ownUrl, share] = parts;
    if (!/^[A-D]$/.test(id) || !/^https?:\/\//i.test(ownUrl) || !share) return null;
    return { id, ownUrl, share };
  }

  function reconstruct(state) {
    const ids = ["A","B","C","D"];
    if (!ids.every(id => state[id]?.share)) return null;
    const byteShares = ids.map(id => b64urlToBytes(state[id].share));
    const len = byteShares[0].length;
    if (!byteShares.every(x => x.length === len)) return null;

    const out = new Uint8Array(len);
    for (const sh of byteShares) {
      for (let i = 0; i < len; i++) out[i] ^= sh[i];
    }
    try {
      const url = new TextDecoder().decode(out);
      return /^https?:\/\//i.test(url) ? url : null;
    } catch {
      return null;
    }
  }

  function renderSlots(state) {
    return ["A","B","C","D"].map(id =>
      `<div class="slot ${state[id] ? "got" : ""}">
        <strong>${id}</strong><br><span class="small">${state[id] ? "已收集" : "未收集"}</span>
      </div>`
    ).join("");
  }

  function setupPage() {
    const base = location.href.split("#")[0];
    const payloads = {};
    for (const id of ["A","B","C","D"]) {
      payloads[id] = `${base}#${id}~${PUBLIC[id]}~${SHARES[id]}`;
    }

    app.innerHTML = `
      <h1>NFC Nail 4→1 測試</h1>
      <p>這是設定頁。把下面四條網址分別寫進 A、B、C、D 四顆 NFC。每顆都包含自己的 YouTube 網址，以及隱藏 F 的其中一份 XOR share。</p>
      <div class="warn">先把這個頁面部署到最終網址，再複製下面的 NFC 內容。若之後改網域或路徑，已寫入的標籤也要跟著改。</div>
      ${["A","B","C","D"].map(id => `
        <div class="setup-item">
          <strong>甲片 ${id}</strong>
          <textarea readonly id="payload-${id}">${escapeHtml(payloads[id])}</textarea>
          <div class="small">約 ${new TextEncoder().encode(payloads[id]).length} Bytes（未計 NDEF 少量額外開銷）</div>
        </div>
      `).join("")}
      <div class="row">
        <button class="secondary" id="reset">清除本機收集進度</button>
      </div>
      <p class="small">注意：這是收藏／彩蛋機制，不是防拷貝 DRM。別人若複製四顆 NFC 的內容，也能重建 F。</p>
    `;

    document.getElementById("reset").onclick = () => {
      localStorage.removeItem(STORAGE_KEY);
      alert("已清除這支瀏覽器的收集進度。");
    };
  }

  function scanPage(tag) {
    const state = loadState();
    state[tag.id] = { share: tag.share, ownUrl: tag.ownUrl };
    saveState(state);

    const hidden = reconstruct(state);
    const count = ["A","B","C","D"].filter(id => state[id]).length;

    app.innerHTML = `
      <h1>已讀取甲片 ${escapeHtml(tag.id)}</h1>
      <p>這片的資料已收進這支手機的瀏覽器。</p>
      <div class="status">${renderSlots(state)}</div>
      <p><strong>${count} / 4</strong> 已收集</p>

      ${hidden ? `
        <div class="unlock">
          <h2 style="margin-top:0">F 已解鎖</h2>
          <p>四份碎片已在瀏覽器記憶體中重建完成。</p>
          <div class="row">
            <a class="btn" href="${escapeHtml(hidden)}">開啟隱藏專輯 F</a>
            <a class="btn secondary" href="${escapeHtml(tag.ownUrl)}">開啟甲片 ${escapeHtml(tag.id)} 的專輯</a>
          </div>
        </div>
      ` : `
        <div class="row">
          <a class="btn" href="${escapeHtml(tag.ownUrl)}">開啟甲片 ${escapeHtml(tag.id)} 的專輯</a>
        </div>
        <p class="small">尚未集齊四片。此頁會在約 1.5 秒後自動開啟這片自己的專輯。</p>
      `}
    `;

    if (!hidden) {
      setTimeout(() => { location.href = tag.ownUrl; }, 1500);
    }
  }

  const tag = decodeTag();
  if (tag) scanPage(tag);
  else setupPage();
})();
</script>
</body>
</html>
