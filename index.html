<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta http-equiv="Content-Language" content="en">
  <meta name="theme-color" content="#0c0c10">
  <title>NFC Nail — Music Scenes V14</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body translate="no" class="notranslate">
  <div class="bg">
    <div class="theme-layer theme-running">
      <div class="running-glow g1"></div>
      <div class="running-glow g2"></div>
      <div class="running-grid"></div>
      <div class="running-noise"></div>
    </div>

    <div class="theme-layer theme-winter">
      <div class="winter-ice ice1"></div>
      <div class="winter-ice ice2"></div>
      <div class="winter-snow" id="winterSnow"></div>
    </div>

    <div class="theme-layer theme-spring">
      <div class="spring-light"></div>
      <div class="spring-leaf l1"></div>
      <div class="spring-leaf l2"></div>
      <div class="spring-bloom"></div>
      <div class="spring-petals" id="springPetals"></div>
    </div>

    <div class="theme-layer theme-hyori">
      <div class="hyori-half hyori-white"></div>
      <div class="hyori-half hyori-black"></div>
      <div class="hyori-split"></div>
      <div class="hyori-orb o1"></div>
      <div class="hyori-orb o2"></div>
      <div class="hyori-bars"></div>
    </div>

    <div class="global-vignette"></div>
  </div>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>NFC NAIL</span>
      </div>
      <button id="openDev" class="ghost-btn" aria-label="Open test panel" hidden>•••</button>
    </header>

    <section class="hero">
      <div class="hero-meta">
        <span id="metaLeft">MUSIC SCENE</span>
        <span id="metaRight">0 / 4</span>
      </div>

      <div class="cover-zone">
        <div class="cover-deco deco-a"></div>
        <div class="cover-deco deco-b"></div>
        <div class="cover-card" id="coverCard">
          <img id="coverImage" class="cover-image" alt="">
          <div id="coverPlaceholder" class="cover-placeholder">
            <div class="placeholder-disc"></div>
            <span>TOUCH A NAIL</span>
          </div>
          <div class="cover-shine"></div>
        </div>
      </div>

      <div class="title-block">
        <p id="eyebrow" class="eyebrow">WAITING</p>
        <h1 id="albumTitle">Locked Scene</h1>
        <p id="albumArtist" class="artist">Scan any nail to unlock a theme</p>
      </div>

      <section class="selector-shell">
        <div class="selector-title">SCENES</div>
        <nav id="collection" class="collection" aria-label="Scene selector"></nav>
      </section>
    </section>

    <section class="player-strip" aria-label="Player controls">
      <div class="player-strip-head">
        <span>LISTEN</span>
        <span id="playerState">LOCKED</span>
      </div>

      <div class="transport">
        <button id="prevTrack" class="transport-btn" aria-label="Previous scene" disabled>
          <span class="icon prev" aria-hidden="true"></span>
        </button>

        <button id="playLink" class="transport-btn play-btn" aria-label="Open on YouTube" disabled>
          <span class="icon play" aria-hidden="true"></span>
        </button>

        <button id="nextTrack" class="transport-btn" aria-label="Next scene" disabled>
          <span class="icon next" aria-hidden="true"></span>
        </button>
      </div>

      <p class="transport-hint">Tap the play button to open the song on YouTube.</p>
    </section>

    <section class="utility">
      <button id="copyCurrent" disabled>Copy current link</button>
      <button id="resetProgress">Reset collection</button>
    </section>

    <footer>LOCAL PROTOTYPE V14 · INLINE PLAYER CONTROLS</footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="devSheet" class="sheet" aria-hidden="true">
    <button id="closeDevScrim" class="sheet-scrim" aria-label="Close"></button>
    <section class="sheet-card">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div>
          <p class="eyebrow">LOCAL ONLY</p>
          <h2>Mock NFC</h2>
        </div>
        <button id="closeDev" class="ghost-btn" aria-label="Close">×</button>
      </div>
      <div class="scan-grid">
        <button data-scan="A">Lilac</button>
        <button data-scan="B">Ice Blue</button>
        <button data-scan="C">Blue / Cream</button>
        <button data-scan="D">Black / White</button>
      </div>
      <button id="randomScan" class="full-btn">Random switch</button>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
