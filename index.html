<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFC Nail 4→1</title><style>body{font-family:-apple-system,sans-serif;background:#111;color:#eee;margin:0;padding:24px}main{max-width:620px;margin:auto;background:#191919;border:1px solid #333;border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.x{padding:12px;text-align:center;border:1px solid #444;border-radius:10px}.on{background:#333}a,button{display:inline-block;margin:6px 6px 0 0;padding:11px 14px;border:0;border-radius:10px;background:#eee;color:#111;text-decoration:none;font-weight:600}.muted{color:#aaa;font-size:13px}</style></head><body><main id="app"></main><script>const K='nfc-nail-v5',I=['A','B','C','D'],E=document.querySelector('#app'),U={A:'https://youtu.be/wp43OdtAAkM',B:'https://youtu.be/beSO_-Xn3vs',C:'https://youtu.be/xEeFrLSkMm8',D:'https://youtu.be/eKoD2CRr_KA'};function G(){try{return JSON.parse(localStorage.getItem(K))||{}}catch{return{}}}function P(s){localStorage.setItem(K,JSON.stringify(s))}function V(s){return '<div class=grid>'+I.map(i=>'<div class="x '+(s[i]?'on':'')+'"><b>'+i+'</b><br>'+(s[i]?'已收集':'未收集')+'</div>').join('')+'</div>'}function B(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(Array.from(atob(s)).map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join(''))}catch{return''}}let h=location.hash.slice(1),s=G();if(!h){E.innerHTML='<h1>NFC Nail 4→1</h1><p>準備完成，請掃描甲片。</p>'+V(s)+'<p class=muted>第五個網址的片段只存在 NFC 內容中。</p><button id=c>清除進度</button>';document.querySelector('#c').onclick=()=>{localStorage.removeItem(K);location.reload()}}else{let m=h.match(/^([A-D])\.([A-Za-z0-9_-]+)$/);if(!m){E.innerHTML='<h1>資料格式錯誤</h1><p class=muted>收到：'+h.replace(/</g,'&lt;')+'</p>'}else{let i=m[1],f=B(m[2]);if(!f){E.innerHTML='<h1>資料格式錯誤</h1>'}else{s[i]=f;P(s);let n=I.filter(x=>s[x]).length,full=I.every(x=>s[x])?I.map(x=>s[x]).join(''):'';E.innerHTML='<h1>已讀取 '+i+'</h1>'+V(s)+'<p><b>'+n+'/4</b> 已收集</p>'+(full?'<h2>第五個已解鎖</h2><a href="'+full+'">開啟第五個</a>':'')+'<a href="'+U[i]+'">開啟這片的專輯</a>'}}}</script></body></html>
